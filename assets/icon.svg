<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Com.Airbnb.Android.Lottie - Lottie Android Binding for .NET</title>
  <desc id="desc">Lottie animation library binding icon - coral rounded square with white play-forward motion mark and teal accent dot representing animation frames</desc>
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e55151"/>
      <stop offset="100%" stop-color="#cc3333"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background: Coral rounded square (22px radius at 512 = ~8px at 128) -->
  <rect x="32" y="32" width="448" height="448" rx="88" fill="url(#brandGradient)" filter="url(#subtleShadow)"/>
  <!-- Main motion mark: Forward play/animation symbol -->
  <g transform="translate(192, 136)" fill="#ffffff">
    <!-- Left triangle (play) -->
    <path d="M0 0 L80 64 L0 128 Z" opacity="0.95"/>
    <!-- Right bar (forward/next frame) -->
    <rect x="104" y="16" width="16" height="96" rx="4"/>
    <rect x="132" y="32" width="16" height="64" rx="4" opacity="0.7"/>
  </g>
  <!-- Accent dot: Teal dot representing keyframe/animation frame -->
  <circle cx="400" cy="384" r="24" fill="url(#accentGradient)" opacity="0.9">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite" />
  </circle>
  <!-- Subtle motion trail dots -->
  <g fill="url(#accentGradient)" opacity="0.4">
    <circle cx="360" cy="400" r="10">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
    <circle cx="330" cy="410" r="6">
      <animate attributeName="opacity" values="0.3;0.05;0.3" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
  </g>
  <!-- Lottie brand initial - subtle, for small sizes -->
  <text x="256" y="340" font-family="Inter Variable, SF Pro Display, system-ui, sans-serif" font-size="120" font-weight="600" fill="#ffffff" fill-opacity="0.12" text-anchor="middle" dominant-baseline="middle">L</text>
</svg>